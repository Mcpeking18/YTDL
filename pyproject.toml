[project]
name = "ytdl"
version = "0.1.0"
description = "YouTube audio and video downloader with a modern dark-mode GUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=6.0.0",
    "fastapi>=0.162.2",
    "pillow>=13.0.0",
    "pywebview>=6.2.1",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
ytdl = "ytdl:main"
ytdl-web = "server:start_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
